<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমাদের প্রেমের গল্প</title>

    <style>
        body {
            background-color: #f8f0e3;
            font-family: 'Arial', sans-serif;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        h1 {
            color: #d1495b;
            font-size: 2.5em;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            min-height: 80px;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        button {
            background-color: #d1495b;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #c03d4c;
        }

        /* যখন টেক্সট লুকানো থাকবে */
        .hidden {
            opacity: 0;
            transform: translateY(20px);
        }
        
        /* শেষ ধাপের বাটনের স্টাইল */
        #yes-button {
            background-color: #4CAF50;
        }
        #yes-button:hover {
            background-color: #45a049;
        }
        #no-button {
            background-color: #f44336;
        }
        #no-button:hover {
            background-color: #da190b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>আমার প্রিয় [তার নাম],</h1>
        <p>আমি তোমাকে কিছু বলতে চাই, কিন্তু ধাপে ধাপে। দয়া করে আমার সাথে থেকো।</p>
        <button id="nextButton">যাত্রা শুরু করি</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.container');
            const nextButton = document.getElementById('nextButton');
            const paragraph = container.querySelector('p');
            
            const steps = [
                "আমার ভালোবাসা শুধু একটি অনুভূতি নয়, এটি আমাদের ভাগ করে নেওয়া নীরব মুহূর্তগুলোতেও আছে...",
                "কঠিন দিনগুলোতেও তুমি যেভাবে আমাকে হাসাও, তার মধ্যেও আছে...",
                "তুমি আমাকে একজন আরও ভালো মানুষ হতে অনুপ্রাণিত করো...",
                "শুধু তোমার সাথে থাকার সাধারণ আনন্দেই আছে...",
                "যে ভবিষ্যত তোমাকে ছাড়া আমি কল্পনাও করতে পারি না, তার মধ্যেও আছে...",
                "তাহলে, আমার তোমাকে শুধু একটি শেষ কথা বলার আছে...",
                "তুমি কি আমাকে বিয়ে করবে?"
            ];
            
            let currentStep = -1;

            nextButton.addEventListener('click', () => {
                currentStep++;
                
                if (currentStep < steps.length) {
                    paragraph.classList.add('hidden');
                    
                    setTimeout(() => {
                        paragraph.textContent = steps[currentStep];
                        paragraph.classList.remove('hidden');
                    }, 500);

                    if (currentStep === 0) {
                        nextButton.textContent = "পরবর্তী";
                    }

                    if (currentStep === steps.length - 1) {
                        nextButton.style.display = 'none';
                        
                        // শেষ ধাপের জন্য ফর্ম এবং বাটন তৈরি করা
                        const form = document.createElement('form');
                        form.id = 'proposal-form';
                        form.action = 'https://formspree.io/f/xzzaolaz';
                        form.method = 'POST';

                        const hiddenInput = document.createElement('input');
                        hiddenInput.type = 'hidden';
                        hiddenInput.name = 'response';
                        hiddenInput.id = 'response-input';

                        const yesButton = document.createElement('button');
                        yesButton.type = 'submit';
                        yesButton.id = 'yes-button';
                        yesButton.textContent = 'হ্যাঁ!';

                        const noButton = document.createElement('button');
                        noButton.type = 'submit';
                        noButton.id = 'no-button';
                        noButton.textContent = 'না';

                        form.appendChild(hiddenInput);
                        form.appendChild(yesButton);
                        form.appendChild(noButton);
                        container.appendChild(form);

                        // বাটনগুলোতে ইভেন্ট লিসেনার যোগ করা
                        yesButton.addEventListener('click', (event) => {
                            event.preventDefault();
                            hiddenInput.value = 'হ্যাঁ';
                            form.submit();
                            container.innerHTML = "<h1>অসাধারণ! আমি তোমাকে অনেক ভালোবাসি! ❤️</h1>";
                        });

                        noButton.addEventListener('click', (event) => {
                            event.preventDefault();
                            hiddenInput.value = 'না';
                            form.submit();
                            container.innerHTML = "<h1>ঠিক আছে, আমি জানি এটা একটা বড় সিদ্ধান্ত। আমি সবসময় তোমার পাশে থাকবো।</h1>";
                        });
                    }
                }
            });
        });
    </script>
</body>
</html>
